<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Personal Moreira | Questionário Inicial</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#14303F;--card:#0C1D27;--ink:#FFFFFF;--mut:#A7BDC9;--c:#1FD8DE;--o:#F0A040;--line:#2C4F61;--err:#FF8A80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:22px 18px 40px}
.logo{display:block;object-fit:cover;width:150px;height:150px;border-radius:50%;margin:10px auto 18px}
h1{font-size:1.7rem;text-align:center;margin:0 0 10px;letter-spacing:.2px}
h2{font-size:1.35rem;margin:22px 0 6px;line-height:1.3}
.sub{color:var(--mut);text-align:center;margin:0 0 24px}
.hint{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.tag{color:var(--o);text-align:center;margin-top:22px;font-size:.9rem}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--c);color:#000;font-weight:700;font-size:1.05rem;padding:15px;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.wa{background:#25D366}
.top{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.85rem}
.back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .25s}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1rem;cursor:pointer}
.opt.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:#0F2A36}
.in{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:1rem;margin-top:10px}
.lab{display:block;margin-top:16px;font-size:.92rem;color:var(--mut)}
.in:focus,.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.alert{background:#2A2410;border:1.5px solid var(--o);color:#FFE2B8;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.93rem}
.note{color:var(--o);font-size:.92rem;margin:18px 0 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:.88rem;color:var(--mut)}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:#1FD8DE;flex:none}
.err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>

 {k:"Medicamentos / restrição médica",t:"m",q:"Usa medicamento contínuo ou tem alguma restrição médica ao exercício?",o:["Uso medicamento contínuo*","Tenho restrição médica ao exercício*","Não"]},
 {k:"Maior dificuldade",t:"s",q:"Qual a sua maior dificuldade hoje?",o:["Falta de método e planejamento","Falta de constância","Não vejo resultado","Dúvidas sobre alimentação","Receio de lesão ou de execução incorreta"]},
 {k:"Início",t:"s",q:"Quando pretende começar?",o:["Imediatamente","Em até 30 dias","Ainda estou pesquisando"]},
 {k:"Processo estruturado",t:"s",q:"Você está de acordo com um processo estruturado (avaliação física inicial, periodização e reavaliações)?",o:["Sim, é o que busco","Quero entender melhor antes"]}
];
const N = S.length, $ = s => document.querySelector(s);
let i = -1, A = S.map(() => ({s:[], d:""})), C = {n:"", w:"", ig:"", ok:false};
const clean = o => o.replace("*","");
const hasStar = (s,a) => a.s.some(j => s.o[j].endsWith("*"));
const cardiac = () => A[5].s.some(j => S[5].o[j].startsWith("Doença cardíaca"));

function view(){
  const app = $("#app");
  window.scrollTo(0,0);
  if(i < 0){
    app.innerHTML = `<img class="logo" src="${LOGO}" alt="Logo Personal Moreira"><h1>Questionário Inicial</h1><p class="sub">Treinamento de força com método e base científica. Responda em cerca de 2 minutos para eu entender seu perfil e indicar o melhor caminho.</p><button class="btn" id="go">Começar</button><p class="tag">Razão • Evidência • Método</p>`;
    $("#go").onclick = () => { i = 0; view(); };
  } else if(i < N){ question(app); }
  else if(i === N){ contact(app); }
  else { done(app); }
}

function head(app){
  const pct = Math.round((i+1)/(N+1)*100);
  return `<div class="top"><button class="back" id="bk" aria-label="Voltar">←</button><div class="bar"><i style="width:${pct}%"></i></div><span>${Math.min(i+1,N)}/${N}</span></div>`;
}

function question(app){
  const s = S[i], a = A[i];
  app.innerHTML = head() + (s.intro ? `<p class="note">${s.intro}</p>` : "") +
    `<h2>${s.q}</h2><p class="hint">${s.t==="m" ? "Marque tudo que se aplica" : "Selecione uma opção"}</p>` +
    `<div class="opts">${s.o.map((o,j) => `<button class="opt${a.s.includes(j)?" on":""}" data-j="${j}">${clean(o)}</button>`).join("")}</div>` +
    (hasStar(s,a) ? `<input class="in" id="det" placeholder="Descreva (opcional)" maxlength="120">` : "") +
    (s.card && cardiac() ? `<div class="alert">Para sua segurança, em casos de doença cardíaca é necessária a avaliação e a liberação do seu cardiologista antes de iniciarmos o treinamento. Pode seguir com o questionário.</div>` : "") +
    `<button class="btn" id="nx" ${a.s.length?"":"disabled"}>Continuar</button>`;
  $("#bk").onclick = () => { i--; view(); };
  $("#nx").onclick = () => { i++; view(); };
  const det = $("#det"); if(det){ det.value = a.d; det.oninput = () => a.d = det.value; }
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const j = +b.dataset.j, o = s.o[j];
    if(s.t === "s"){
      a.s = [j];
      if(!o.endsWith("*")){ a.d = ""; render1(); setTimeout(() => { i++; view(); }, 180); return; }
    } else {
      if(a.s.includes(j)) a.s = a.s.filter(x => x !== j);
      else if(NENHUM.test(o)) a.s = [j];
      else a.s = a.s.filter(x => !NENHUM.test(s.o[x])).concat(j);
      if(!hasStar(s,a)) a.d = "";
    }
    view1();
  });
}
function render1(){ question($("#app")); }
function view1(){ const y = window.scrollY; question($("#app")); window.scrollTo(0,y); }

function contact(app){
  app.innerHTML = head() +
    `<h2>Quase lá! Como posso falar com você?</h2><p class="hint">Seus dados e respostas serão usados somente para avaliar seu perfil.</p>` +
    `<label class="lab" for="n">Nome completo</label><input class="in" id="n" autocomplete="name" style="margin-top:6px">` +
    `<label class="lab" for="w">WhatsApp com DDD</label><input class="in" id="w" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678" style="margin-top:6px">` +
    `<label class="lab" for="ig">@ do Instagram (opcional)</label><input class="in" id="ig" placeholder="@seuperfil" style="margin-top:6px">` +
    `<label class="chk"><input type="checkbox" id="ok"><span>Autorizo o uso dos dados informados, inclusive os de saúde, exclusivamente para avaliação do meu perfil e prescrição de treinamento, nos termos da Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018). Posso solicitar a exclusão dos meus dados a qualquer momento.</span></label>` +
    `<div class="err" id="er" role="alert"></div><button class="btn" id="sd">Enviar</button>`;
  $("#n").value = C.n; $("#w").value = C.w; $("#ig").value = C.ig; $("#ok").checked = C.ok;
  $("#bk").onclick = () => { save(); i--; view(); };
  $("#sd").onclick = () => {
    save();
    const dig = C.w.replace(/\D/g,"");
    let e = "";
    if(C.n.trim().length < 3) e = "Informe seu nome completo.";
    else if(dig.length < 10 || dig.length > 13) e = "Informe o WhatsApp com DDD.";
    else if(!C.ok) e = "Marque a autorização para continuar.";
    if(e){ $("#er").textContent = e; return; }
    i++; view();
  };
}
function save(){ C.n = $("#n").value; C.w = $("#w").value; C.ig = $("#ig").value.trim(); C.ok = $("#ok").checked; }

function done(app){
  const L = S.map((s,j) => {
    const a = A[j], v = a.s.map(x => clean(s.o[x])).join(", ");
    return `• ${s.k}: ${v}${a.d ? " (" + a.d + ")" : ""}`;
  });
  const msg = `Olá, Personal Moreira! Sou ${C.n.trim()}${C.ig ? " (" + C.ig + ")" : ""}. Respondi o questionário inicial:\n${L.join("\n")}\nMeu WhatsApp: ${C.w}`;
  const url = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  app.innerHTML = `<img class="logo" src="${LOGO}" alt="Logo Personal Moreira"><h1>Recebi suas respostas!</h1>` +
    `<p class="sub">Obrigado, ${C.n.trim().split(" ")[0]}. Toque no botão abaixo: suas respostas já vão prontas na mensagem e eu retorno por lá.</p>` +
    (cardiac() ? `<div class="alert">Lembrete: por causa da doença cardíaca informada, será necessária a liberação do seu cardiologista antes de iniciarmos.</div>` : "") +
    `<a class="btn wa" href="${url}" target="_blank" rel="noopener">Falar no WhatsApp</a><p class="tag">Razão • Evidência • Método</p>`;
}
view();
</script>
</body>
</html>
